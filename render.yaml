services:
  - type: web
    name: safespace-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: safespace-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: ""

  - type: web
    name: safespace-ui
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: BACKEND_BASE_URL
        fromService:
          type: web
          name: safespace-api
          property: host

databases:
  - name: safespace-db
    region: oregon
    plan: free
    databaseName: safespace
    user: safespace
